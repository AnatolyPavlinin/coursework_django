{% extends 'mailer/base_generic.html' %}

{% block title %}
  {% if object %}Редактирование сообщения{% else %}Новое сообщение{% endif %}
{% endblock %}

{% block content %}
<h1>{% if object %}Редактирование сообщения{% else %}Новое сообщение{% endif %}</h1>

<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="btn btn-success">{% if object %}Сохранить изменения{% else %}Создать{% endif %}</button>
</form>
{% endblock %}

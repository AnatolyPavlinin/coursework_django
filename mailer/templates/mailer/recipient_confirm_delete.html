{% extends 'base_generic.html' %}

{% block content %}

<form method="post">
  {% csrf_token %}
  <p>Это действие необратимо.</p>

  <a href="{% url 'recipient-list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
